<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16" />
      <stop offset="50%" stop-color="#0c1322" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="cyanBlueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 44px;
      font-weight: 800;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .tag {
      font-family: 'SF Mono', Monaco, Menlo, 'Courier New', monospace;
      font-size: 15px;
      font-weight: 700;
      fill: #38bdf8;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 20px;
      font-weight: 500;
      fill: #94a3b8;
      letter-spacing: 0.2px;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 12px;
      font-weight: 600;
      fill: #cbd5e1;
    }
    .wave-line {
      fill: none;
      stroke-linecap: round;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="240" fill="url(#bgGrad)" rx="16" />

  <!-- Subtle Grid Dots / Tech Background Pattern -->
  <g opacity="0.12">
    <circle cx="100" cy="50" r="1.5" fill="#38bdf8" />
    <circle cx="200" cy="50" r="1.5" fill="#38bdf8" />
    <circle cx="300" cy="50" r="1.5" fill="#38bdf8" />
    <circle cx="400" cy="50" r="1.5" fill="#38bdf8" />
    <circle cx="500" cy="50" r="1.5" fill="#38bdf8" />
    <circle cx="600" cy="50" r="1.5" fill="#38bdf8" />
    <circle cx="700" cy="50" r="1.5" fill="#38bdf8" />
    <circle cx="800" cy="50" r="1.5" fill="#38bdf8" />
    <circle cx="900" cy="50" r="1.5" fill="#38bdf8" />
    <circle cx="1000" cy="50" r="1.5" fill="#38bdf8" />
    <circle cx="1100" cy="50" r="1.5" fill="#38bdf8" />

    <circle cx="100" cy="110" r="1.5" fill="#38bdf8" />
    <circle cx="200" cy="110" r="1.5" fill="#38bdf8" />
    <circle cx="300" cy="110" r="1.5" fill="#38bdf8" />
    <circle cx="400" cy="110" r="1.5" fill="#38bdf8" />
    <circle cx="500" cy="110" r="1.5" fill="#38bdf8" />
    <circle cx="600" cy="110" r="1.5" fill="#38bdf8" />
    <circle cx="700" cy="110" r="1.5" fill="#38bdf8" />
    <circle cx="800" cy="110" r="1.5" fill="#38bdf8" />
    <circle cx="900" cy="110" r="1.5" fill="#38bdf8" />
    <circle cx="1000" cy="110" r="1.5" fill="#38bdf8" />
    <circle cx="1100" cy="110" r="1.5" fill="#38bdf8" />
  </g>

  <!-- Glowing Geometric / Wave Trails -->
  <path d="M 0,180 C 300,120 450,220 750,170 C 950,135 1100,195 1200,165" class="wave-line" stroke="url(#cyanBlueGrad)" stroke-width="3" opacity="0.4" filter="url(#glow)" />
  <path d="M 0,180 C 300,120 450,220 750,170 C 950,135 1100,195 1200,165" class="wave-line" stroke="url(#cyanBlueGrad)" stroke-width="1.8" opacity="0.8" />
  <path d="M 0,205 C 350,160 500,240 850,195 C 1020,170 1140,215 1200,190" class="wave-line" stroke="#38bdf8" stroke-width="1" opacity="0.25" />

  <!-- Corner Tech Accent -->
  <path d="M 30,25 L 20,25 L 20,35" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.6" />
  <path d="M 1170,25 L 1180,25 L 1180,35" stroke="#818cf8" stroke-width="2" fill="none" opacity="0.6" />
  <path d="M 30,215 L 20,215 L 20,205" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.6" />
  <path d="M 1170,215 L 1180,215 L 1180,205" stroke="#818cf8" stroke-width="2" fill="none" opacity="0.6" />

  <!-- Main Title -->
  <text x="70" y="80" class="title">Juan Esteban</text>
  
  <!-- Identity Tag Badge -->
  <rect x="375" y="48" width="135" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
  <text x="442" y="69" class="tag" text-anchor="middle">JuanesBy08</text>

  <!-- Subtitle -->
  <text x="70" y="118" class="subtitle">Software Engineer &amp; Systems Architect</text>

  <!-- Feature Pills -->
  <g transform="translate(70, 142)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="170" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="14" cy="13" r="4" fill="#38bdf8" />
    <text x="94" y="17" class="pill-text" text-anchor="middle">Distributed Systems</text>

    <!-- Pill 2 -->
    <rect x="182" y="0" width="165" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="196" cy="13" r="4" fill="#34d399" />
    <text x="272" y="17" class="pill-text" text-anchor="middle">Cloud FinOps (-85%)</text>

    <!-- Pill 3 -->
    <rect x="359" y="0" width="175" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="373" cy="13" r="4" fill="#f43f5e" />
    <text x="454" y="17" class="pill-text" text-anchor="middle">Off-Main-Thread 60FPS</text>

    <!-- Pill 4 -->
    <rect x="546" y="0" width="160" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="560" cy="13" r="4" fill="#fbbf24" />
    <text x="634" y="17" class="pill-text" text-anchor="middle">Multiplatform Native</text>
  </g>
</svg>
